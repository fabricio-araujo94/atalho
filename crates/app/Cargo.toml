[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Main entry point and orchestrator for the Atalho desktop application"

[[bin]]
name = "Atalho"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[package.metadata.wix]
name = "Atalho"
product-name = "Atalho"
manufacturer = "Atalho"
upgrade-guid = "f8c13a21-39d6-4f3f-a037-7707c860f2e7"
license = false

[lints]
workspace = true

[dependencies]
core = { workspace = true }
executor = { workspace = true }
iced = { workspace = true }
indexer = { workspace = true }
matcher = { workspace = true }
persistence = { workspace = true }
platform = { workspace = true }
ui = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
core = { workspace = true }
indexer = { workspace = true }
matcher = { workspace = true }
persistence = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "release_hardening"
harness = false

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
